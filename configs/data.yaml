# FailureDNA Data Pipeline Configuration

dataset:
  variant: "FD004"
  raw_dir: "data/raw"
  train_file: "train_FD004.txt"
  test_file: "test_FD004.txt"
  rul_file: "RUL_FD004.txt"

schema:
  id_col: "unit_id"
  cycle_col: "cycle"
  setting_cols:
    - "setting_1"  # Altitude (0 - 42,000 ft)
    - "setting_2"  # Mach number (0.0 - 0.84)
    - "setting_3"  # Throttle Resolver Angle (TRA 20 - 100)
  sensor_cols:
    - "s_1"   # Fan inlet temperature (T2)
    - "s_2"   # LPC outlet temperature (T24)
    - "s_3"   # HPC outlet temperature (T30)
    - "s_4"   # LPT outlet temperature (T50)
    - "s_5"   # Fan inlet pressure (P2)
    - "s_6"   # Bypass-duct pressure (P15)
    - "s_7"   # HPC outlet pressure (P30)
    - "s_8"   # Physical fan speed (Nf)
    - "s_9"   # Physical core speed (Nc)
    - "s_10"  # Engine pressure ratio (epr)
    - "s_11"  # Static pressure at HPC outlet (Ps30)
    - "s_12"  # Ratio of fuel flow to Ps30 (phi)
    - "s_13"  # Corrected fan speed (NRf)
    - "s_14"  # Corrected core speed (NRc)
    - "s_15"  # Bypass ratio (BPR)
    - "s_16"  # Burner fuel-air ratio (farB)
    - "s_17"  # Bleed enthalpy (htBleed)
    - "s_18"  # Required fan speed (Nf_dmd)
    - "s_19"  # Demanded corrected fan speed (PCNfR_dmd)
    - "s_20"  # HPT coolant bleed (W31)
    - "s_21"  # LPT coolant bleed (W32)

split:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  seed: 42
  stratify_by_length: false

preprocessing:
  scaler_type: "robust"  # Options: 'robust', 'standard', 'minmax'
  variance_threshold: 1.0e-5  # Drop sensors with variance below this threshold in train data
  cluster_operating_conditions: true
  num_operating_regimes: 6  # Canonical C-MAPSS FD004 regimes

windowing:
  window_size: 50
  stride: 1
  min_trajectory_length: 50
  drop_short_trajectories: true
