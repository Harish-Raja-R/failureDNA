# FailureDNA Training & Optimization Configuration

training:
  seed: 42
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 1.0e-4
  max_epochs: 30
  early_stopping_patience: 7
  gradient_clip_val: 1.0
  lr_scheduler: "cosine"  # 'cosine', 'plateau', 'none'
  warmup_epochs: 3
  device: "cpu"

downstream:
  rul_clipping_threshold: 125.0  # Piecewise-linear RUL maximum cap (cycles)
  probes:
    - "linear"
    - "ridge"
    - "random_forest"
    - "xgboost"
  random_forest:
    n_estimators: 100
    max_depth: 10
    random_state: 42
    n_jobs: -1
  xgboost:
    n_estimators: 150
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    random_state: 42
    n_jobs: -1
