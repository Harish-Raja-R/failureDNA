services:
  # Primary FailureDNA Full-Stack Service (FastAPI + Embedded React Frontend)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: failuredna-app
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - CHECKPOINT_PATH=models/checkpoints/failuredna_regime_aware/best_failuredna_model.pt
      - BUNDLE_DIR=models/inference_bundle
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Optional Independent Frontend Service for Distributed / Multi-Container Setups
  frontend-standalone:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: failuredna-frontend
    ports:
      - "3000:80"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - distributed
