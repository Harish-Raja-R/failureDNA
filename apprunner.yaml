version: 1.0
runtime: custom
build:
  commands:
    build:
      - echo "Preparing FailureDNA container for AWS App Runner"
run:
  command: sh -c "python -m uvicorn failuredna.api.main:app --host 0.0.0.0 --port 8000"
  network:
    port: 8000
    env:
      - name: PORT
        value: "8000"
      - name: PYTHONUNBUFFERED
        value: "1"
